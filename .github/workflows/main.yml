# The name of the workflow as it appears in the GitHub Actions tab
name: Node.js CI

# Defines the events that trigger the workflow
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write   # the PR comment
  statuses: write        # only if you set commit-status: true
  
# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write   # for the PR comment
    steps:
      - uses: andrianyablonskyy/thub-action@v1
        with:
          url: https://coord.yablonskyy.com      # your Coordinator's publicUrl
          key: ${{ secrets.THUB_CI_TOKEN }}      # dashboard → CI tokens
          type: sw                               # needs an online SW Client
          command: ./ci/test.sh
          dry-run: true
          comment: true          # default; or on-failure / false
          commit-status: true    # optional
